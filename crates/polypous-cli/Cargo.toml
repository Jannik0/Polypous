[package]
name = "polypous-cli"
description = "`polyp` developer CLI: inspect files, validate `.polyp`, probe devices, plan placement, run pipelines, benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "polyp"
path = "src/main.rs"

# Backend features (ADR-0003), forwarded through `polypous` (and from there to `polypous-runtime`
# and `polypous-backend`). `cpu` is always available. This crate is the top of the chain, so
# `--features polypous-cli/<backend>` compiles every crate's GPU tests in a workspace build
# (docs/dev-environment.md, "GPU tests"; issue #65).
[features]
default = ["cpu"]
cpu = ["polypous/cpu"]
cuda = ["polypous/cuda"]
vulkan = ["polypous/vulkan"]
metal = ["polypous/metal"]

[dependencies]
polypous.workspace = true
# `polyp train`: the first Ctrl-C cancels the run, the second ends the process (public-api.md
# §1.4, "CLI"). MIT OR Apache-2.0. The workspace denies `unsafe_code`; this crate keeps the
# signal handler's unsafe code out of Polypous. It runs the handler on its own thread, and on
# Windows handles Ctrl-C and Ctrl-Break. New in the lock file: `ctrlc` and `nix` 0.32 (MIT, unix
# only; its dependencies bitflags, cfg-if, cfg_aliases and libc were already there). On Windows it
# uses windows-sys 0.61 and on Apple dispatch2 0.3, both already in the lock file. Not the
# `termination` feature: only SIGINT, not SIGTERM/SIGHUP.
ctrlc = "3.5.3"
# `polyp devices --json`. MIT OR Apache-2.0; already in the lock file.
serde_json = "1.0.154"
# The CLI installs the log subscriber (`RUST_LOG`, to stderr). MIT; already in the lock file.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The integration tests drive the prober's test-only fault injection (crashes, hangs, malformed
# output, fake devices) through environment variables. A dev-dependency feature: `cargo build`,
# `cargo run` and `cargo install` of `polyp` don't have it (placement.md §1, "Testing the prober").
polypous = { workspace = true, features = ["test-fault-injection"] }

[lints]
workspace = true
