[package]
name = "polypous-cli"
description = "`polyp` developer CLI: inspect files, validate `.polyp`, probe devices, plan placement, run pipelines, benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "polyp"
path = "src/main.rs"

# Backend features (ADR-0003), forwarded through `polypous`. `cpu` is always available.
[features]
default = ["cpu"]
cpu = ["polypous/cpu"]
cuda = ["polypous/cuda"]
vulkan = ["polypous/vulkan"]
metal = ["polypous/metal"]

[dependencies]
polypous.workspace = true
# `polyp devices --json`. MIT OR Apache-2.0; already in the lock file.
serde_json = "1.0.154"
# The CLI installs the log subscriber (`RUST_LOG`, to stderr). MIT; already in the lock file.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The integration tests drive the prober's test-only fault injection (crashes, hangs, malformed
# output, fake devices) through environment variables. A dev-dependency feature: `cargo build`,
# `cargo run` and `cargo install` of `polyp` don't have it (placement.md §1, "Testing the prober").
polypous = { workspace = true, features = ["test-fault-injection"] }

[lints]
workspace = true
