[package]
name = "polypous-train"
description = "Training config, training loop, own optimizers and schedules on DynTensor, initial values, metrics, checkpoints, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
polypous-runtime.workspace = true
polypous-backend.workspace = true
# Param `init`s, fans and the Polypous random generator (graph-ir.md §2.4.1, §3.1.12). Pure Rust.
polypous-ir.workspace = true
# Error enums (CLAUDE.md conventions). MIT OR Apache-2.0; already in the lock file.
thiserror = "2.0.21"
# The `optimizer`, `schedule` and `gradient_clip` config types deserialize from the training
# config's JSON (training.md §2.8). MIT OR Apache-2.0; already a dependency of polypous-ir,
# polypous-backend and the facade.
serde = { version = "1.0.229", features = ["derive"] }
# The `safetensors` dataset reads its file through the workspace's safetensors reader
# (training.md §3.5.2, formats.md §1). Pure Rust, no GPU dependency.
polypous-formats.workspace = true
# The `image_folder` dataset decodes PNG files (training.md §3.5.4; #81). MIT OR Apache-2.0, pure
# Rust, already in the lock file at this version (through `image`), so no second copy. Its own
# dependencies (bitflags, crc32fast, fdeflate, flate2, miniz_oxide, simd-adler32, adler2) are
# MIT/Apache-2.0/Zlib and have no GPU dependency.
png = "0.18.1"
# The count of ignored files of an image folder is logged at `warn` (§3.5.4). MIT; already a
# dependency of polypous-formats and the backend.
tracing = "0.1.44"

# The reference tests read the init and training component fixtures' JSON sidecars and
# safetensors files (`tests/init_reference.rs`, `tests/train_reference.rs`). Both MIT OR
# Apache-2.0 or workspace crates; already in the lock file. `float_roundtrip` (a feature of the
# same crate, no new dependency) parses JSON numbers to the nearest f64, which the schedule
# fixtures' exact values need: the default parser can be 1 ulp off.
[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
