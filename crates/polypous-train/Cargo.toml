[package]
name = "polypous-train"
description = "Training config, training loop, own optimizers and schedules on DynTensor, initial values, metrics, checkpoints, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
polypous-runtime.workspace = true
polypous-backend.workspace = true
# Param `init`s, fans and the Polypous random generator (graph-ir.md §2.4.1, §3.1.12). Pure Rust.
polypous-ir.workspace = true
# Error enums (CLAUDE.md conventions). MIT OR Apache-2.0; already in the lock file.
thiserror = "2.0.21"

# The reference tests read the init fixtures' JSON sidecars and safetensors files
# (`tests/init_reference.rs`). Both MIT OR Apache-2.0 or workspace crates; already in the lock file.
[dev-dependencies]
serde_json = "1.0.154"
polypous-formats.workspace = true

[lints]
workspace = true
