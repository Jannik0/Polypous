[package]
name = "polypous-backend"
description = "Burn integration: `BackendKind` enum, device discovery/probing, `DynTensor` (dynamic rank + dtype), implementations of every IR op, cross-device transfer, autodiff wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Backend features (ADR-0003). They map to Burn's backends; see ADR-0007's follow-up notes.
[features]
default = ["cpu"]
# Burn's pure-Rust CPU backend (`burn-flex`). Burn's own `cpu` feature is the CubeCL CPU runtime
# (MLIR/LLVM), which is much heavier and not used. `ndarray` is deprecated upstream.
cpu = ["burn/flex"]
# CubeCL CUDA runtime. The NVIDIA driver is loaded at runtime (cudarc dynamic loading), and kernels
# are compiled to PTX with a bundled LLVM, so no CUDA toolkit is needed to build or run. The first
# build downloads that LLVM bundle (see docs/dev-environment.md).
cuda = ["burn/cuda", "dep:cubecl"]
# CubeCL wgpu runtime pinned to Vulkan, with SPIR-V code generation.
vulkan = ["burn/vulkan", "dep:cubecl"]
# CubeCL wgpu runtime pinned to Metal (MSL). macOS only.
metal = ["burn/metal", "dep:cubecl"]

[dependencies]
polypous-ir.workspace = true
burn = { workspace = true, features = ["std"] }
# Not used in code yet. Declared so that the exact CubeCL pin (ADR-0007) is part of dependency
# resolution and matches the CubeCL version Burn uses. `polypous-quant` uses it for its kernels.
cubecl = { workspace = true, optional = true }
# Error enums (CLAUDE.md conventions). MIT OR Apache-2.0; already in the lock file through Burn.
thiserror = "2.0.21"

[lints]
workspace = true
