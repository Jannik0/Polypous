[package]
name = "polypous-backend"
description = "Burn integration: `BackendKind` enum, device discovery/probing, `DynTensor` (dynamic rank + dtype), implementations of every IR op, cross-device transfer, autodiff wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Backend features (ADR-0003). They map to Burn's backends; see ADR-0007's follow-up notes.
[features]
default = ["cpu"]
# Burn's pure-Rust CPU backend (`burn-flex`). Burn's own `cpu` feature is the CubeCL CPU runtime
# (MLIR/LLVM), which is much heavier and not used. `ndarray` is deprecated upstream.
cpu = ["burn/flex"]
# CubeCL CUDA runtime. The NVIDIA driver is loaded at runtime (cudarc dynamic loading), and kernels
# are compiled to PTX with a bundled LLVM, so no CUDA toolkit is needed to build or run. The first
# build downloads that LLVM bundle (see docs/dev-environment.md).
cuda = ["burn/cuda", "dep:cubecl", "cubecl/cuda", "dep:cudarc"]
# CubeCL wgpu runtime pinned to Vulkan, with SPIR-V code generation.
vulkan = ["burn/vulkan", "dep:cubecl", "cubecl/vulkan"]
# CubeCL wgpu runtime pinned to Metal (MSL). macOS only.
metal = ["burn/metal", "dep:cubecl", "cubecl/metal"]
# TEST ONLY: fault injection for the prober and the in-process fallback (crash, hang, malformed
# output, fake devices, fingerprint override; src/probe/faults.rs). Enabled only through
# dev-dependencies (polypous-cli's tests), never in a release build. See placement.md §1,
# "Testing the prober".
test-fault-injection = []

[dependencies]
polypous-ir.workspace = true
burn = { workspace = true, features = ["std"] }
# The exact CubeCL pin (ADR-0007), the same CubeCL Burn uses. Device discovery reads memory, identity
# and capabilities from a device's CubeCL client (src/device); `polypous-quant` uses it for kernels.
# The runtime features above are the ones Burn already enables, so they add no crates.
cubecl = { workspace = true, optional = true }
# CUDA driver API, already in the tree through cubecl-cuda (same version and loading mode, so no new
# crates). Used only for facts Burn/CubeCL don't expose: free memory and whether a device is integrated.
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system"], optional = true }
# Device info types are serialized as JSON lines by the prober process (ADR-0013, #14).
serde = { version = "1.0.229", features = ["derive"] }
# The prober protocol's JSON lines, the probe cache and the crash journal (ADR-0013, #14).
# MIT OR Apache-2.0; already in the lock file (it was a dev-dependency here).
serde_json = "1.0.154"
# Logging of the probe (cache hits, prober starts and crashes). MIT; already in the lock file
# through Burn.
tracing = "0.1.44"
# Error enums (CLAUDE.md conventions). MIT OR Apache-2.0; already in the lock file through Burn.
thiserror = "2.0.21"

# The CPU's marketing name from the registry (`describe_device` for the CPU). Safe wrapper over the
# registry API (the workspace denies `unsafe`). MIT OR Apache-2.0; its dependencies (windows-link,
# windows-result, windows-strings) are already in the lock file through Burn's tree.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[lints]
workspace = true
